# =============================================================================
# Configuration commune - transport-api
# =============================================================================
spring.application.name=public-api

# Profil actif par defaut (surcharge : SPRING_PROFILES_ACTIVE=prod|test)
spring.profiles.default=dev

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JPA commun
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Serveur Public API (ne pas réutiliser SERVER_PORT partagé avec admin)
server.port=${PUBLIC_SERVER_PORT:8081}

# CORS (origines autorisees pour le frontend admin / public)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:4500,http://10.0.26.205:4200}

# JWT (secret >= 32 caracteres ; surchargez en prod via JWT_SECRET)
app.security.jwt.secret=${JWT_SECRET:TransportReportingJwtSecretKey_ChangeMe_32charsMin!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# JWT voyageur uniquement (refus des tokens ADMIN)
app.security.accepted-token-types=PASSENGER

# QR Code : URL de base (surchargee par profil) et stockage des images
app.qr.base-url=${APP_QR_BASE_URL:}
# Chemins relatifs → résolus vers <repo>/data/... (SharedStoragePaths), absolus si APP_* défini
app.qr.storage-path=${APP_QR_STORAGE_PATH:data/qr-codes}

# Pieces jointes signalements (partagé public-api + admin-api)
app.upload.path=${APP_UPLOAD_PATH:data/attachments}
# Optionnel : forcer la racine multi-module (sinon détection auto)
app.storage.root=${APP_STORAGE_ROOT:}

# Frontend public voyageur (liens e-mail de suivi securise par UUID)
app.frontend.public-base-url=${APP_FRONTEND_PUBLIC_BASE_URL:http://localhost:4200}

# Google OAuth 2.0 / OIDC (voyageur) — client_secret uniquement via GOOGLE_CLIENT_SECRET
app.google.client-id=${GOOGLE_CLIENT_ID:431515331732-8jkc67a4ee2bstbf0fct3n4lmnu4qslg.apps.googleusercontent.com}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:OCSPX-OZrFh74jmyPt_ED00hsuX_2bGoOL}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
app.google.frontend-callback-url=${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:4200/connexion/google/callback}

# OTP e-mail (connexion voyageur — activé par défaut)
app.auth.otp.enabled=${APP_AUTH_OTP_ENABLED:true}
app.auth.otp.length=${APP_AUTH_OTP_LENGTH:6}
app.auth.otp.expiration-minutes=${APP_AUTH_OTP_EXPIRATION_MINUTES:5}
app.auth.otp.max-attempts=${APP_AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.resend-delay-seconds=${APP_AUTH_OTP_RESEND_DELAY_SECONDS:60}
app.auth.otp.max-resends-per-challenge=${APP_AUTH_OTP_MAX_RESENDS:5}

# Cloudflare Turnstile (activé par défaut — secrets via variables d'environnement)
# DEV : clés de test Cloudflare (toujours passer) via scripts/run-public-api.ps1
# PROD : CLOUDFLARE_SITE_KEY + CLOUDFLARE_SECRET_KEY injectés à l'exécution (jamais en Git) 


 
app.cloudflare.enabled=${CLOUDFLARE_ENABLED:true}
app.cloudflare.site-key=${CLOUDFLARE_SITE_KEY:1x00000000000000000000AA}
app.cloudflare.secret-key=${CLOUDFLARE_SECRET_KEY:1x0000000000000000000000000000000AA}

# Rate limiting API publique (compteurs en mémoire JVM, perdus au redémarrage).
# Désactivation globale : APP_RATE_LIMIT_ENABLED=false
# ou java -jar public-api.jar --app.rate-limit.enabled=false
# Au-delà de la limite : HTTP 429 + en-tête Retry-After.
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}

# POST /api/public/signalements (création + pièces jointes). Clé : IP.
# Défaut : 5 requêtes / 600 s.
app.rate-limit.signalement.limit=${APP_RATE_LIMIT_SIGNALEMENT_LIMIT:5}
app.rate-limit.signalement.window-seconds=${APP_RATE_LIMIT_SIGNALEMENT_WINDOW_SECONDS:600}

# POST /api/public/auth/login, /register (e-mail) et /otp/resend (transaction).
# Clé : IP + hash du sujet. Défaut : 3 requêtes / 600 s.
app.rate-limit.otp.limit=${APP_RATE_LIMIT_OTP_LIMIT:3}
app.rate-limit.otp.window-seconds=${APP_RATE_LIMIT_OTP_WINDOW_SECONDS:600}

# POST /api/public/auth/otp/verify. Clé : IP + hash de la transaction.
# Défaut : 5 requêtes / 600 s.
app.rate-limit.otp-verify.limit=${APP_RATE_LIMIT_OTP_VERIFY_LIMIT:5}
app.rate-limit.otp-verify.window-seconds=${APP_RATE_LIMIT_OTP_VERIFY_WINDOW_SECONDS:600}

# GET /api/public/suivi/{uuid} et GET /api/public/signalements/{uuid}/follow-up.
# Clé : IP. Défaut : 60 requêtes / 60 s.
app.rate-limit.suivi.limit=${APP_RATE_LIMIT_SUIVI_LIMIT:60}
app.rate-limit.suivi.window-seconds=${APP_RATE_LIMIT_SUIVI_WINDOW_SECONDS:60}

# GET /api/public/reponses (accueil public). Clé : IP. Défaut : 60 requêtes / 60 s.
app.rate-limit.reponses.limit=${APP_RATE_LIMIT_REPONSES_LIMIT:60}
app.rate-limit.reponses.window-seconds=${APP_RATE_LIMIT_REPONSES_WINDOW_SECONDS:60}

# GET /api/public/report-types et GET /api/public/supports. Clé : IP.
# Défaut : 120 requêtes / 60 s.
app.rate-limit.catalog.limit=${APP_RATE_LIMIT_CATALOG_LIMIT:120}
app.rate-limit.catalog.window-seconds=${APP_RATE_LIMIT_CATALOG_WINDOW_SECONDS:60}

# Limites multipart (10 Mo / fichier, marge pour le total 25 Mo + JSON)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

