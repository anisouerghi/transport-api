app.qr.base-url=http://localhost:4200
# Défauts relatifs au repo (SharedStoragePaths) ; override recommandé :
#   APP_UPLOAD_PATH / APP_QR_STORAGE_PATH / APP_STORAGE_ROOT
app.qr.storage-path=${APP_QR_STORAGE_PATH:data/qr-codes}
app.upload.path=${APP_UPLOAD_PATH:data/attachments}
app.frontend.public-base-url=http://localhost:4200
app.google.frontend-callback-url=${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:4200/connexion/google/callback}

#transport_reporting
spring.datasource.url=${DATABASE_URL:jdbc:mysql://10.0.2.6:3306/signalement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:anis19806}
spring.datasource.password=${DATABASE_PASSWORD:anis@19806}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Critique : ne jamais exécuter schema.sql depuis public-api (réservé à admin-api)
spring.sql.init.mode=never

# OTP e-mail (connexion voyageur — hérite de application.properties, surcharge via env)
app.auth.otp.enabled=${APP_AUTH_OTP_ENABLED:true}
