# =============================================================================
# Admin API — configuration commune
# =============================================================================
spring.application.name=admin-api

spring.profiles.default=dev

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Serveur Admin API
server.port=${ADMIN_SERVER_PORT:8082}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:4500}

app.security.jwt.secret=${JWT_SECRET:TransportReportingJwtSecretKey_ChangeMe_32charsMin!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# JWT agent uniquement (refus des tokens PASSENGER)
app.security.accepted-token-types=ADMIN

app.qr.base-url=${APP_QR_BASE_URL:}
app.qr.storage-path=${APP_QR_STORAGE_PATH:data/qr-codes}

app.upload.path=${APP_UPLOAD_PATH:data/attachments}
app.storage.root=${APP_STORAGE_ROOT:}

app.frontend.public-base-url=${APP_FRONTEND_PUBLIC_BASE_URL:http://localhost:4200}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

