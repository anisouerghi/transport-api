# =============================================================================
# Profil DEV - Admin API
# =============================================================================
# Schema SQL destructif : UNIQUEMENT avec le profil supplémentaire "dev-reset"
#   mvn -pl admin-api -am spring-boot:run -Dspring-boot.run.profiles=dev,dev-reset
# Seeders Java (permissions / menus / admin) restent actifs et sont idempotents.

app.qr.base-url=http://localhost:4200/#
# Défauts relatifs au repo (SharedStoragePaths) ; override recommandé :
#   APP_UPLOAD_PATH / APP_QR_STORAGE_PATH / APP_STORAGE_ROOT
app.qr.storage-path=${APP_QR_STORAGE_PATH:data/qr-codes}
app.upload.path=${APP_UPLOAD_PATH:data/attachments}
app.frontend.public-base-url=http://localhost:4200

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/transport_reporting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Pas de DROP au démarrage normal — compatible public-api sur la même MySQL
spring.sql.init.mode=never
