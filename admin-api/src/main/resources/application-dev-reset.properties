# =============================================================================
# Profil DEV-RESET — réinitialisation volontaire du schéma (DROP + CREATE)
# =============================================================================
# Usage :
#   SPRING_PROFILES_ACTIVE=dev,dev-reset
#   ou : -Dspring-boot.run.profiles=dev,dev-reset
#
# Arrêter public-api avant d'utiliser ce profil (tables détruites).

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
