# =============================================================================
# Profil DEV - developpement local
# =============================================================================

# URL de base des QR codes (page publique de signalement en local)
app.qr.base-url=http://localhost:4200
app.qr.storage-path=./data/qr-codes
app.upload.path=./data/attachments
app.frontend.public-base-url=http://localhost:4200

# Base de donnees MySQL locale
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/transport_reporting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema / seed déplacés vers admin-api (ne plus exécuter ici)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=never