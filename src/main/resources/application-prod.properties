# =============================================================================
# Profil PROD - production
# =============================================================================

# URL de base des QR codes (page publique de signalement en production)
app.qr.base-url=${APP_QR_BASE_URL:https://transport.mon-domaine.com}
app.qr.storage-path=${APP_QR_STORAGE_PATH:/var/data/transport/qr-codes}
app.upload.path=${APP_UPLOAD_PATH:/var/data/transport/attachments}

# Base de donnees MySQL (variables d'environnement obligatoires)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Pas d'initialisation SQL automatique en production
spring.sql.init.mode=never
